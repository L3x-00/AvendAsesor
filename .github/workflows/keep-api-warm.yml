name: Mantener el API despierta

# Mitigación del arranque en frío del plan Free de Render: la instancia se
# duerme tras ~15 min sin tráfico y el primer request tarda 16-26 s. Una
# petición cada 5 min mantiene el proceso caliente y deja margen frente a la
# ventana de reposo.
#
# Esto NO corrige los 0,1 vCPU del plan ni el arranque en frío posterior a un
# despliegue. Es una mitigación, no una solución de rendimiento. Los cron de
# GitHub Actions pueden retrasarse varios minutos bajo carga, así que este job
# es el respaldo del servicio externo de uptime cada 5 min. Cuando el producto
# crezca, la solución durable es el plan Starter de Render.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-api-warm
  cancel-in-progress: true

# Destino configurable: en el traspaso al cliente hay que fijar la variable de
# repositorio API_HEALTH_URL (Settings -> Secrets and variables -> Actions ->
# Variables) con la URL /health de SU API. El valor por defecto mantiene el
# servicio actual y evita que este job apunte a una API ajena tras el traslado.
env:
  API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://avend-asesor-api.onrender.com/health' }}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Solicitar /health
        # 90 s para absorber el arranque en frío (16-26 s medidos) sin marcar
        # fallo: aunque el cron se retrase, la petición sigue despertando Render.
        run: curl --fail --silent --show-error --max-time 90 "$API_HEALTH_URL" > /dev/null
