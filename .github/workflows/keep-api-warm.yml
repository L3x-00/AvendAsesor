name: Mantener el API despierta

# Mitigación del arranque en frío del plan Free de Render: la instancia se
# duerme tras ~15 min sin tráfico y el primer request tarda 16-26 s. Una
# petición cada 10 min mantiene el proceso caliente.
#
# Esto NO corrige los 0,1 vCPU del plan ni el arranque en frío posterior a un
# despliegue. Es una mitigación, no una solución de rendimiento. Recomendación
# abierta: un servicio de uptime con intervalo de 5 min (los cron de GitHub
# Actions pueden retrasarse varios minutos bajo carga) y, cuando el producto
# crezca, el plan Starter de Render.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-api-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Solicitar /health
        run: curl --fail --silent --show-error --max-time 20 https://avend-asesor-api.onrender.com/health > /dev/null
