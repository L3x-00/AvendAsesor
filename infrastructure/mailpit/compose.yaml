name: avend-asesor-mailpit

services:
  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    environment:
      MP_MAX_MESSAGES: '100'
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      MP_SMTP_DISABLE_RDNS: 'true'
